<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d39">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SAMPLE">
  <meta name="description" content="Offline biomolecular archaeology specimen and sampling journal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <title>SAMPLE — Biomolecular field journal</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brandmark" aria-hidden="true"><span class="brandmark-dot"></span><span class="brandmark-line"></span><span class="brandmark-line short"></span></div>
        <div><div class="brandname">SAMPLE<span class="brandperiod">.</span></div><div class="branddesc">BIOMOLECULAR FIELD JOURNAL</div></div>
      </div>
      <button id="add-quick" class="circle-button" type="button" aria-label="New specimen">+</button>
    </header>
    <div id="update-banner" class="update-banner hidden" role="status">
      <span>A new version of SAMPLE is ready.</span><button id="apply-update" type="button">Update</button>
    </div>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-nav="overview" class="nav-item active"><span class="nav-icon">▦</span><span>Overview</span></button>
      <button type="button" data-nav="specimens" class="nav-item"><span class="nav-icon">◈</span><span>Specimens</span></button>
      <button type="button" data-nav="samples" class="nav-item"><span class="nav-icon">◎</span><span>Samples</span></button>
      <button type="button" data-nav="data" class="nav-item"><span class="nav-icon">⇅</span><span>Data</span></button>
    </nav>
  </div>
  <div id="modal-host" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="assets/qr.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
